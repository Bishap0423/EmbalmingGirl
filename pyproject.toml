[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "embalming-girl"
version = "0.1.0"
description = "Local Python game engine and web server for Embalming Girl"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["packages/game_engine", "apps/server"]

[tool.setuptools.package-data]
embalming_game = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["packages/game_engine", "apps/server"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/game_engine", "apps/server"]
